<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b87f8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#7b76f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7b76f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#08080a"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- logo mark -->
  <g transform="translate(80,72)">
    <rect width="72" height="72" rx="18" fill="#0e0e14" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.6"/>
    <text x="36" y="50" font-family="'JetBrains Mono',monospace" font-size="42" font-weight="700" text-anchor="middle" fill="url(#accent)">S</text>
  </g>
  <text x="172" y="120" font-family="'JetBrains Mono',monospace" font-size="22" letter-spacing="2" fill="#8b87f8">▸ AI ENGINEER</text>

  <!-- name -->
  <text x="80" y="330" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="96" font-weight="700" fill="#e8e8ec" letter-spacing="-3">Than Van Hong Son</text>

  <!-- tagline -->
  <text x="80" y="400" font-family="'Inter','Segoe UI',sans-serif" font-size="32" fill="#9a9aa6">Real-time Computer Vision · Generative AI · LLM Systems</text>

  <!-- chips -->
  <g font-family="'JetBrains Mono',monospace" font-size="20" fill="#c9c9d2">
    <g transform="translate(80,470)">
      <rect width="150" height="46" rx="23" fill="#121214" stroke="#26262b"/>
      <text x="75" y="30" text-anchor="middle">PyTorch</text>
    </g>
    <g transform="translate(246,470)">
      <rect width="170" height="46" rx="23" fill="#121214" stroke="#26262b"/>
      <text x="85" y="30" text-anchor="middle">LangChain</text>
    </g>
    <g transform="translate(432,470)">
      <rect width="240" height="46" rx="23" fill="#121214" stroke="#26262b"/>
      <text x="120" y="30" text-anchor="middle">Stable Diffusion</text>
    </g>
    <g transform="translate(688,470)">
      <rect width="130" height="46" rx="23" fill="#121214" stroke="#26262b"/>
      <text x="65" y="30" text-anchor="middle">MLOps</text>
    </g>
  </g>

  <text x="80" y="585" font-family="'JetBrains Mono',monospace" font-size="20" fill="#6a6a76">volcano4bit6.github.io</text>
  <rect x="0" y="626" width="1200" height="4" fill="url(#accent)"/>
</svg>
